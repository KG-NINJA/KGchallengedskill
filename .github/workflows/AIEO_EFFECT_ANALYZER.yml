name: AIEO Effect Analyzer 📈

on:
  workflow_run:
    workflows: ["🌀 AIEO Multi-Keyword Visibility Pulse"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: aieo-repository-writes
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect upstream artifacts
        uses: actions/github-script@v7
        with:
          script: |
            // Confirm that the upstream workflow run is readable.
            const runId = context.payload.workflow_run.id;
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            core.info(`Upstream artifacts: ${response.data.total_count}`);

      - name: Install dependencies
        run: python -m pip install pandas matplotlib

      - name: Run composite index generator
        run: python scripts/aieo_composite_tracker.py

      - name: Commit and push composite index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aieo_composite_chart.png aieo_composite_log.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔁 Updated AIEO Composite Index"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
