name: AIEO Effect Analyzer 📈

on:
  workflow_run:
    workflows: ["🌀 AIEO Multi-Keyword Visibility Pulse"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aieo-effect-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install pandas matplotlib numpy

      - name: Run effect analyzer
        run: python scripts/aieo_effect_compose.py

      - name: Commit and push effect results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aieo_effect_chart.png aieo_effect_log.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📈 Updated AIEO Effect Index"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
