name: 🌀 AIEO Multi-Keyword Visibility Pulse

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: aieo-repository-writes
  cancel-in-progress: false

jobs:
  pulse:
    name: 📡 Visibility Tracking & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib requests feedparser

      - name: 🔍 Run AIEO Visibility Tracker
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: |
          echo "📊 Starting visibility tracking..."
          python scripts/aieo_visibility_tracker.py

      - name: 📈 Run Enhanced Visibility Analysis
        run: |
          echo "🔍 Running enhanced analysis..."
          python scripts/enhanced_visibility_analyzer.py

      - name: 📊 Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add visibility_log.csv || true
          git add visibility_chart.png || true
          git add visibility_growth_rate.png || true
          git add visibility_detailed_analysis.png || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📡 Updated AIEO Visibility Pulse - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
