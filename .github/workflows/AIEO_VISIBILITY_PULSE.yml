name: 🌀 AIEO Multi-Keyword Visibility Pulse

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: aieo-visibility-pulse
  cancel-in-progress: false

jobs:
  pulse:
    name: 📡 Visibility Tracking & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib requests feedparser

      - name: 🔍 Collect isolated visibility metrics
        id: collect
        continue-on-error: true
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aieo_visibility_tracker.py

      - name: ⚠️ Report provider degradation
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Google Custom Searchを利用できないため、新しい可視性データは保存しませんでした。既存の正常データは保持されています。"
          {
            echo "## AIEO Visibility Provider"
            echo ""
            echo "- Collection: degraded"
            echo "- New metrics written: no"
            echo "- Existing validated metrics: preserved"
            echo "- Required operator action: review GOOGLE_API_KEY application restrictions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📈 Analyze historical legacy search data
        if: steps.collect.outcome == 'success'
        run: |
          if [ -s visibility_log.csv ]; then
            python scripts/enhanced_visibility_analyzer.py
          else
            echo "Legacy visibility history is absent; skipping legacy chart."
          fi

      - name: 📊 Commit and push results
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aieo_visibility_metrics.csv
          for path in visibility_chart.png visibility_growth_rate.png visibility_detailed_analysis.png; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📡 Updated isolated AIEO visibility metrics - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
