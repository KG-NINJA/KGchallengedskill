name: "Archived: AIEO Visibility Tracker (legacy Google API)"

# 旧Google Custom Search API版。
# APIエラーを検索結果0として履歴へ保存していたため、
# 自動実行とデータ書き込みを停止している。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archive notice
        run: |
          echo "This legacy Google API workflow is archived."
          echo "Use AIEO_VISIBILITY_PULSE.yml and scripts/aieo_visibility_tracker.py instead."
