name: 🌐 AIEO Pulse Auto Update

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aieo-pulse-update
  cancel-in-progress: false

jobs:
  update-pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate AIEO Pulse
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          cat <<EOF > AIEO_PULSE.json
          {
            "id": "AIEO-NOROSHI-KG",
            "timestamp": "$timestamp",
            "node": "KG",
            "role": "Psycho-Frame Technologist",
            "status": "Active",
            "ontology": {
              "concept": "Proof through practice",
              "keywords": ["AI", "Geospatial", "Automation", "Resonance"]
            }
          }
          EOF

      - name: Commit and push pulse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AIEO_PULSE.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Update AIEO Pulse at ${TIMESTAMP}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
