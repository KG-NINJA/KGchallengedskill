name: "Archived: Noroshi AIEO Self-Verifying Pulse"

# 旧Noroshi生成workflow。
# 現行のAIEO_PULSE.ymlと同じAIEO_PULSE.jsonを書き換え、
# quoted heredocによりtimestampへシェル式を文字列のまま保存していたため停止した。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archive notice
        run: |
          echo "This legacy Noroshi workflow is archived."
          echo "Use AIEO_PULSE.yml for the active pulse update."
