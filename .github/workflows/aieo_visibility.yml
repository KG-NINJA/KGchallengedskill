name: "Archived: AIEO Multi-Keyword Visibility Pulse (legacy scraper)"

# 旧Google HTMLスクレイピング版。
# Googleの表示形式や言語に依存して検索件数を誤って0として記録するため、
# 自動実行とデータ書き込みを停止している。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archive notice
        run: |
          echo "This legacy visibility scraper is archived."
          echo "Use AIEO_VISIBILITY_PULSE.yml and scripts/aieo_visibility_tracker.py instead."
