# 最新の正常な可視性データから共鳴とメモリを更新するワークフロー
name: AIEO Memory Update

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aieo-memory-update
  cancel-in-progress: false

jobs:
  refresh-aieo-memory:
    name: Refresh AIEO memory assets
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 必要な依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib

      - name: 最新の正常な可視性データを検証
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          path = Path("aieo_visibility_metrics.csv")
          required = {
              "timestamp",
              "name",
              "github_followers",
              "github_repos",
              "web_mentions",
              "domain_mentions",
              "visibility_score",
          }

          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit("aieo_visibility_metrics.csv が存在しないか空です")

          frame = pd.read_csv(path)
          missing = sorted(required - set(frame.columns))
          if missing:
              raise SystemExit(f"可視性データの必須列がありません: {missing}")
          if frame.empty:
              raise SystemExit("可視性データに有効な行がありません")

          print(f"✓ 最新の正常データを使用: {len(frame)}行")
          print(f"✓ 最終観測時刻: {frame['timestamp'].iloc[-1]}")
          PY

      - name: レゾナンスインデクサーを実行
        run: python scripts/resonance_indexer.py

      - name: メモリエンジンを実行
        run: python scripts/aieo_memory_engine.py

      - name: 変更をcommitしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            resonance_snapshot.png \
            resonance_report.json \
            aieo_memory.json \
            AIEO_MEMORY_STATE.md \
            aieo_prompt_context.txt

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update AIEO memory assets - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
