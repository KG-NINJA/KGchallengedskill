# 定期的にAIEOの可視性と共鳴を更新するワークフロー
name: AIEO Memory Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aieo-repository-writes
  cancel-in-progress: false

jobs:
  refresh-aieo-memory:
    name: Refresh AIEO memory assets
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_CX: ${{ secrets.GOOGLE_CX }}

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 可視性メトリクスを収集
        run: python scripts/aieo_visibility_tracker.py

      - name: レゾナンスインデクサーを実行
        run: python scripts/resonance_indexer.py

      - name: 変更をcommitしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aieo_visibility_metrics.csv resonance_snapshot.png resonance_report.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update AIEO memory snapshots - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
