# 最新の正常な可視性データから共鳴とメモリを更新するワークフロー
name: AIEO Memory Update

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aieo-memory-update
  cancel-in-progress: false

jobs:
  refresh-aieo-memory:
    name: Refresh AIEO memory assets
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 必要な依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib

      - name: 可視性観測の新規性を検証
        id: freshness
        # 同じ観測を6時間ごとに新しいinteractionとして再記録しない。
        run: python scripts/aieo_memory_freshness.py

      - name: 処理済み観測をスキップしたことを記録
        if: steps.freshness.outputs.fresh == 'false'
        run: |
          {
            echo "## AIEO Memory Update"
            echo ""
            echo "- Result: skipped"
            echo "- Reason: visibility observation already processed"
            echo "- Source timestamp: ${{ steps.freshness.outputs.source_timestamp }}"
            echo "- Last processed: ${{ steps.freshness.outputs.processed_timestamp }}"
            echo "- Memory / confidence changes: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: レゾナンスインデクサーを実行
        if: steps.freshness.outputs.fresh == 'true'
        run: python scripts/resonance_indexer.py

      - name: メモリエンジンを実行
        if: steps.freshness.outputs.fresh == 'true'
        run: python scripts/aieo_memory_engine.py

      - name: 変更をcommitしてpush
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            resonance_snapshot.png \
            resonance_report.json \
            aieo_memory.json \
            AIEO_MEMORY_STATE.md \
            aieo_prompt_context.txt

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update AIEO memory assets - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
