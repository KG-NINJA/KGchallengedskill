name: AIEO Wave Resonance Tracker

on:
  workflow_run:
    workflows: ["AIEO Effect Analyzer 📈"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aieo-wave-resonance
  cancel-in-progress: false

jobs:
  resonate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install pandas matplotlib numpy

      - name: Run resonance tracker
        run: python scripts/aieo_composite_tracker.py

      - name: Commit and push resonance results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aieo_resonance_chart.png aieo_resonance_log.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎵 Updated AIEO Resonance Index"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
